<!-- Ejemplo visual: conecte la acción a su backend antes de publicarlo. -->
<form class="wv-form" action="#" method="get"><div class="wv-field"><label for="wv-name">Nombre</label><input class="wv-input" id="wv-name" name="name" autocomplete="name" placeholder="Tu nombre" required></div><div class="wv-field"><label for="wv-email">Correo electrónico</label><input class="wv-input" id="wv-email" name="email" type="email" autocomplete="email" placeholder="nombre@empresa.com" aria-describedby="wv-email-help" required><span class="wv-help" id="wv-email-help">Lo utilizaremos para responder a tu consulta.</span></div><div class="wv-field"><label for="wv-message">¿En qué podemos ayudarte?</label><textarea class="wv-input" id="wv-message" name="message" placeholder="Cuéntanos sobre tu proceso"></textarea></div><label class="wv-check"><input type="checkbox" name="privacy" required><span>He leído la <a href="/legal/politica-privacidad.html">política de privacidad</a>.</span></label><button class="wv-btn wv-btn--primary" type="button">Enviar consulta</button></form>
